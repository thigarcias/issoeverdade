# Fly.io — worker de mídia (yt-dlp + ffmpeg). Gerado para `fly launch`/`deploy`.
app = "iev-media-worker"
primary_region = "gru"

[build]
  dockerfile = "worker/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
